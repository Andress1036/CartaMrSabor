
<!-- este h1 solo para generar un espacio, que permita ver incluso con el navbar dinamico -->
<div class="accordion" id="accordionDesayunos">
  <div class="accordion-item">
    <h1 id="headingDesayunos">
      <button
        class="accordion-button custom-center-btn collapsed"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapseDesayunos"
        aria-expanded="false"
        aria-controls="collapseDesayunos"
        tabindex="-1"
      >
        <cite class="w-100 text-center"
          ><strong> D e s a y u n o s </strong></cite
        >
      </button>
    </h1>
    <div
      id="collapseDesayunos"
      class="accordion-collapse collapse"
      aria-labelledby="headingDesayunos"
      data-bs-parent="#accordionDesayunos"
    >
      <div class="accordion-body p-0">
        <div class="container">
          <div id="rowTest" class="row">
            @for (plato of desayunos; track plato.id) {
              <div class="col-12 col-md-6 col-lg-4">
                <div class="card fixed-card">
                  <h3 class="card-title" id="title-list">
                    <cite
                      ><b>{{ plato.titulo }}</b></cite
                    >
                  </h3>
                  <img
                    src="{{ plato.img }}"
                    class="card-img-top"
                    alt="{{ plato.titulo }}"
                  />
                  <div class="card-body card-content">
                    <p class="card-text">
                      {{ plato.ingredientes }}
                    </p>
                    <p class="card-text" id="precio">$ {{ plato.precio }}</p>
                  </div>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<br />
